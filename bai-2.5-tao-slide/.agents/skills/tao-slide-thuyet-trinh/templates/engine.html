<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PRESENTATION_TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Theme 1: Cyber Dark (Default) */
      --bg-main: #090d16;
      --bg-card: rgba(18, 24, 38, 0.85);
      --bg-card-hover: rgba(28, 38, 58, 0.95);
      --border-card: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(99, 102, 241, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent-primary: #6366f1;
      --accent-secondary: #06b6d4;
      --accent-success: #10b981;
      --accent-warning: #f59e0b;
      --accent-danger: #f43f5e;
      --accent-purple: #a855f7;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --card-glow: 0 0 25px rgba(99, 102, 241, 0.25);
    }

    /* Theme 1 alias: Cyber Dark */
    body.theme-cyber-dark {
      --bg-main: #090d16;
      --bg-card: rgba(18, 24, 38, 0.85);
      --bg-card-hover: rgba(28, 38, 58, 0.95);
      --border-card: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(99, 102, 241, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent-primary: #6366f1;
      --accent-secondary: #06b6d4;
      --card-glow: 0 0 25px rgba(99, 102, 241, 0.25);
    }

    /* Optional Theme: Deep Navy */
    body.theme-deep-navy {
      --bg-main: #0a1128;
      --bg-card: rgba(16, 28, 56, 0.85);
      --bg-card-hover: rgba(24, 40, 78, 0.95);
      --border-card: rgba(56, 189, 248, 0.12);
      --border-accent: rgba(56, 189, 248, 0.4);
      --accent-primary: #0284c7;
      --accent-secondary: #38bdf8;
      --card-glow: 0 0 25px rgba(2, 132, 199, 0.25);
    }

    /* Optional Theme: Clean Light */
    body.theme-clean-light {
      --bg-main: #f1f5f9;
      --bg-card: rgba(255, 255, 255, 0.92);
      --bg-card-hover: #ffffff;
      --border-card: rgba(0, 0, 0, 0.08);
      --border-accent: rgba(99, 102, 241, 0.3);
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-dim: #94a3b8;
      --card-glow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-sans);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      user-select: none;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation & Progress Bar */
    #progress-bar-container {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.06);
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
    }
    #progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary), var(--accent-success));
      transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    header {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(12px);
      z-index: 50;
    }
    body.theme-clean-light header {
      background: rgba(255, 255, 255, 0.85);
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 0.88rem;
      letter-spacing: -0.01em;
    }
    .brand-tag {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(6, 182, 212, 0.25));
      border: 1px solid var(--border-accent);
      color: #a5b4fc;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 6px 13px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.22);
      transform: translateY(-1px);
    }
    .btn-action.active {
      background: linear-gradient(135deg, var(--accent-primary), #4f46e5);
      border-color: #818cf8;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
      color: #ffffff;
    }

    .slide-counter {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: var(--text-muted);
      padding: 0 8px;
    }

    /* Main Deck Stage */
    #deck-stage {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 40px 48px;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      width: 92%;
      max-width: 1280px;
      height: calc(100vh - 120px);
      max-height: 720px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      padding: 38px 48px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      opacity: 0;
      visibility: hidden;
      transform: scale(0.96) translateY(20px);
      transition: opacity 0.4s ease, transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.4s;
      overflow-y: auto;
    }

    .slide.active {
      opacity: 1;
      visibility: visible;
      transform: scale(1) translateY(0);
      z-index: 10;
    }

    /* Micro-animations: Staggered Fade-up for child components */
    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .slide.active .slide-eyebrow {
      animation: slideInUp 0.38s ease 0.05s both;
    }
    .slide.active .slide-title {
      animation: slideInUp 0.42s ease 0.12s both;
    }
    .slide.active .slide-subtitle {
      animation: slideInUp 0.45s ease 0.18s both;
    }
    .slide.active .grid-2 > *,
    .slide.active .grid-3 > *,
    .slide.active .grid-4 > * {
      animation: slideInUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .slide.active .grid-2 > *:nth-child(1),
    .slide.active .grid-3 > *:nth-child(1),
    .slide.active .grid-4 > *:nth-child(1) { animation-delay: 0.22s; }
    .slide.active .grid-2 > *:nth-child(2),
    .slide.active .grid-3 > *:nth-child(2),
    .slide.active .grid-4 > *:nth-child(2) { animation-delay: 0.29s; }
    .slide.active .grid-3 > *:nth-child(3),
    .slide.active .grid-4 > *:nth-child(3) { animation-delay: 0.36s; }
    .slide.active .grid-4 > *:nth-child(4) { animation-delay: 0.43s; }

    .slide.active .terminal-box,
    .slide.active .compare-table {
      animation: slideInUp 0.45s ease 0.25s both;
    }

    /* Typography */
    .slide-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }
    .eyebrow-indigo { color: #818cf8; }
    .eyebrow-cyan { color: #22d3ee; }
    .eyebrow-emerald { color: #34d399; }
    .eyebrow-amber { color: #fbbf24; }
    .eyebrow-rose { color: #fb7185; }

    .slide-title {
      font-size: 2.15rem;
      font-weight: 800;
      line-height: 1.22;
      letter-spacing: -0.025em;
      color: #ffffff;
      margin-bottom: 10px;
    }
    body.theme-clean-light .slide-title {
      color: #0f172a;
    }

    .slide-subtitle {
      font-size: 1.02rem;
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: 22px;
    }

    /* Grids & Cards */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      flex: 1;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      flex: 1;
    }
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      flex: 1;
    }

    .box-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 14px;
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .box-card:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(99, 102, 241, 0.35);
      box-shadow: var(--card-glow);
      transform: translateY(-3px);
    }
    body.theme-clean-light .box-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }
    body.theme-clean-light .box-card:hover {
      background: #ffffff;
      border-color: #cbd5e1;
    }

    .box-card-highlight {
      background: linear-gradient(145deg, rgba(99, 102, 241, 0.12), rgba(6, 182, 212, 0.06));
      border-color: rgba(99, 102, 241, 0.3);
    }

    .card-header-icon {
      font-size: 1.5rem;
      margin-bottom: 12px;
      display: inline-block;
    }
    .card-heading {
      font-size: 1.02rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    body.theme-clean-light .card-heading {
      color: #0f172a;
    }
    .card-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.6;
      flex: 1;
    }

    /* Terminal Window Mockup */
    .terminal-box {
      background: #0b0f19;
      border: 1px solid #1e293b;
      border-radius: 12px;
      overflow: hidden;
      font-family: var(--font-mono);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
      margin-top: 10px;
    }
    .terminal-topbar {
      background: #131b2e;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid #1e293b;
    }
    .term-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .term-dot-r { background: #ef4444; }
    .term-dot-y { background: #f59e0b; }
    .term-dot-g { background: #10b981; }
    .term-title {
      font-size: 0.72rem;
      color: #64748b;
      margin-left: 8px;
    }
    .terminal-body {
      padding: 16px 18px;
      font-size: 0.82rem;
      line-height: 1.65;
      color: #e2e8f0;
      overflow-x: auto;
    }
    .term-cmd { color: #38bdf8; font-weight: 600; }
    .term-flag { color: #f43f5e; }
    .term-comment { color: #64748b; font-style: italic; }
    .term-success { color: #34d399; }
    .term-warn { color: #fbbf24; }

    /* Comparison Table */
    .compare-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 0.86rem;
    }
    .compare-table th {
      background: rgba(255, 255, 255, 0.05);
      text-align: left;
      padding: 12px 16px;
      font-weight: 700;
      color: #e2e8f0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .compare-table td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      line-height: 1.5;
    }
    .compare-table tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    /* Badges & Pills */
    .badge-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 700;
      font-family: var(--font-mono);
    }
    .pill-red { background: rgba(239, 68, 68, 0.18); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .pill-green { background: rgba(16, 185, 129, 0.18); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .pill-blue { background: rgba(99, 102, 241, 0.18); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.3); }
    .pill-amber { background: rgba(245, 158, 11, 0.18); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }

    /* Bottom Navigation Bar */
    footer {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(9, 13, 22, 0.85);
      font-size: 0.78rem;
      color: var(--text-dim);
    }
    body.theme-clean-light footer {
      background: rgba(255, 255, 255, 0.85);
      border-top: 1px solid rgba(0, 0, 0, 0.06);
    }

    .nav-hints {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .kbd {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      padding: 1px 6px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-main);
    }

    /* Speaker Notes Drawer (Nút bật kịch bản người nói) */
    #notes-drawer {
      position: fixed;
      right: 0;
      top: 56px;
      width: 440px;
      height: calc(100vh - 108px);
      background: #0d121f;
      border-left: 1px solid rgba(99, 102, 241, 0.25);
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.6);
      padding: 24px;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 80;
      overflow-y: auto;
    }
    body.theme-clean-light #notes-drawer {
      background: #ffffff;
      border-left: 1px solid rgba(0, 0, 0, 0.1);
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.1);
    }
    #notes-drawer.open {
      transform: translateX(0);
    }

    .notes-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 16px;
    }
    .notes-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #818cf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .notes-content {
      font-size: 0.92rem;
      line-height: 1.7;
      color: #cbd5e1;
    }
    body.theme-clean-light .notes-content {
      color: #334155;
    }
    .notes-content blockquote {
      background: rgba(99, 102, 241, 0.1);
      border-left: 3px solid var(--accent-primary);
      padding: 12px 14px;
      border-radius: 0 8px 8px 0;
      margin: 14px 0;
      font-style: italic;
      color: #e0e7ff;
    }
    body.theme-clean-light .notes-content blockquote {
      background: #eff6ff;
      color: #1e3a8a;
    }
    .notes-tag {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    /* Print / PDF Mode */
    @media print {
      @page {
        size: A4 landscape;
        margin: 0;
      }
      body {
        overflow: visible !important;
        height: auto !important;
        background: #ffffff !important;
        color: #000000 !important;
      }
      header, footer, #notes-drawer, #progress-bar-container {
        display: none !important;
      }
      #deck-stage {
        display: block !important;
        padding: 0 !important;
      }
      .slide {
        position: relative !important;
        opacity: 1 !important;
        visibility: visible !important;
        transform: none !important;
        page-break-after: always !important;
        break-after: page !important;
        width: 100% !important;
        max-width: 100% !important;
        height: 100vh !important;
        border: none !important;
        box-shadow: none !important;
        background: #ffffff !important;
        color: #0f172a !important;
      }
      .slide-title { color: #0f172a !important; }
      .box-card {
        background: #f8fafc !important;
        border-color: #e2e8f0 !important;
        color: #1e293b !important;
      }
      .card-heading { color: #0f172a !important; }
      .card-desc { color: #475569 !important; }
      .terminal-box { background: #0f172a !important; color: #f8fafc !important; }
    }
  </style>
</head>
<body class="{{THEME_CLASS}}">

  <!-- Top Progress Bar -->
  <div id="progress-bar-container">
    <div id="progress-bar"></div>
  </div>

  <!-- Header -->
  <header>
    <div class="brand">
      <span class="brand-tag">{{TOPIC_TAG}}</span>
      <span>{{PRESENTATION_TITLE}}</span>
    </div>

    <div class="controls">
      <span class="slide-counter" id="slide-num">01 / {{TOTAL_SLIDES}}</span>
      <button class="btn-action" id="btn-prev" title="Trang trước (Phím Mũi tên Trái)">◀ Trước</button>
      <button class="btn-action" id="btn-next" title="Trang sau (Phím Mũi tên Phải hoặc Phím Cách)">Sau ▶</button>
      <button class="btn-action" id="btn-notes" title="Bật/Tắt Lời thoại kịch bản thuyết trình (Phím S)">🎙️ Lời Thoại (S)</button>
      <button class="btn-action" id="btn-fullscreen" title="Toàn màn hình (Phím F)">⛶ Toàn Màn Hình</button>
    </div>
  </header>

  <!-- Main Slide Deck Stage -->
  <main id="deck-stage">
    <!-- SLIDES_START -->
{{SLIDES_CONTENT}}
    <!-- SLIDES_END -->
  </main>

  <!-- Speaker Notes Drawer -->
  <aside id="notes-drawer">
    <div class="notes-header">
      <div class="notes-title">
        <span>🎙️</span>
        <span>KỊCH BẢN NGƯỜI NÓI (SPEAKER SCRIPT)</span>
      </div>
      <button class="btn-action" id="btn-close-notes" style="padding: 4px 8px;">✕</button>
    </div>
    <span class="notes-tag" id="notes-slide-tag">SLIDE 01</span>
    <div class="notes-content" id="notes-body">
      <!-- Script will be injected via JS -->
    </div>
  </aside>

  <!-- Footer Navigation -->
  <footer>
    <div class="nav-hints">
      <span>Điều khiển:</span>
      <span><span class="kbd">◀</span> <span class="kbd">▶</span> hoặc <span class="kbd">Space</span> để chuyển slide</span>
      <span><span class="kbd">S</span> Bật lời thoại</span>
      <span><span class="kbd">F</span> Toàn màn hình</span>
      <span><span class="kbd">Ctrl+P</span> Xuất PDF</span>
    </div>
    <div>
      <span>{{COPYRIGHT_TEXT}}</span>
    </div>
  </footer>

  <script>
    (function() {
      const slides = document.querySelectorAll('.slide');
      const progressBar = document.getElementById('progress-bar');
      const slideNumDisplay = document.getElementById('slide-num');
      const btnPrev = document.getElementById('btn-prev');
      const btnNext = document.getElementById('btn-next');
      const btnNotes = document.getElementById('btn-notes');
      const btnCloseNotes = document.getElementById('btn-close-notes');
      const btnFullscreen = document.getElementById('btn-fullscreen');
      const notesDrawer = document.getElementById('notes-drawer');
      const notesBody = document.getElementById('notes-body');
      const notesSlideTag = document.getElementById('notes-slide-tag');

      let currentSlide = 0;
      const totalSlides = slides.length;

      function updateSlide(index) {
        if (index < 0) index = 0;
        if (index >= totalSlides) index = totalSlides - 1;
        currentSlide = index;

        slides.forEach((slide, i) => {
          slide.classList.toggle('active', i === currentSlide);
        });

        // Update progress bar
        const progress = totalSlides > 0 ? ((currentSlide + 1) / totalSlides) * 100 : 0;
        progressBar.style.width = progress + '%';

        // Update counter
        const currentStr = String(currentSlide + 1).padStart(2, '0');
        const totalStr = String(totalSlides).padStart(2, '0');
        slideNumDisplay.textContent = `${currentStr} / ${totalStr}`;

        // Update notes & auto scroll drawer to top
        const activeSlideElem = slides[currentSlide];
        if (activeSlideElem) {
          const notesText = activeSlideElem.getAttribute('data-notes') || 'Chưa có ghi chú kịch bản cho slide này.';
          notesSlideTag.textContent = `SLIDE ${currentStr} / ${totalStr}`;
          notesBody.innerHTML = `<blockquote>"${notesText}"</blockquote>`;
        }
        notesDrawer.scrollTop = 0;
      }

      function nextSlide() {
        if (currentSlide < totalSlides - 1) {
          updateSlide(currentSlide + 1);
        }
      }

      function prevSlide() {
        if (currentSlide > 0) {
          updateSlide(currentSlide - 1);
        }
      }

      function toggleNotes() {
        notesDrawer.classList.toggle('open');
        btnNotes.classList.toggle('active', notesDrawer.classList.contains('open'));
      }

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => {
            console.error('Error attempting to enable fullscreen:', err);
          });
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          }
        }
      }

      // Event listeners
      btnNext.addEventListener('click', nextSlide);
      btnPrev.addEventListener('click', prevSlide);
      btnNotes.addEventListener('click', toggleNotes);
      btnCloseNotes.addEventListener('click', toggleNotes);
      btnFullscreen.addEventListener('click', toggleFullscreen);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'Enter' || e.key === 'PageDown') {
          e.preventDefault();
          nextSlide();
        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp' || e.key === 'Backspace') {
          e.preventDefault();
          prevSlide();
        } else if (e.key === 's' || e.key === 'S') {
          e.preventDefault();
          toggleNotes();
        } else if (e.key === 'f' || e.key === 'F') {
          e.preventDefault();
          toggleFullscreen();
        } else if (e.key === 'Home') {
          e.preventDefault();
          updateSlide(0);
        } else if (e.key === 'End') {
          e.preventDefault();
          updateSlide(totalSlides - 1);
        }
      });

      // Initialize first slide
      updateSlide(0);
    })();
  </script>
</body>
</html>
